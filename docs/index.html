<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Informe SVD - Compresión de Imágenes</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            margin: 0;
            padding: 0;
            background: #f5f5f5;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
        }
        .container {
            max-width: 900px;
            width: 100%;
            padding: 40px 20px;
            text-align: center;
        }
        h1 {
            color: #2c3e50;
            margin-bottom: 10px;
        }
        .subtitle {
            color: #7f8c8d;
            margin-bottom: 30px;
        }
        .pdf-frame {
            width: 100%;
            height: 800px;
            border: none;
            box-shadow: 0 4px 20px rgba(0,0,0,0.15);
            border-radius: 8px;
            background: white;
        }
        .download-btn {
            display: inline-block;
            margin-top: 20px;
            padding: 12px 30px;
            background: #2980b9;
            color: white;
            text-decoration: none;
            border-radius: 6px;
            font-weight: bold;
            transition: background 0.3s;
        }
        .download-btn:hover {
            background: #1a5276;
        }
        .fallback {
            margin-top: 20px;
            padding: 20px;
            background: #fff3cd;
            border-radius: 6px;
            color: #856404;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>📊 Compresión de Imágenes mediante SVD</h1>
        <p class="subtitle">Informe Técnico — Cómputo Científico</p>
        
        <iframe class="pdf-frame" src="informe_svd.pdf" type="application/pdf">
            <p class="fallback">
                Tu navegador no soporta PDF embebido. 
                <a href="informe_svd.pdf" class="download-btn">📥 Descargar PDF</a>
            </p>
        </iframe>
        
        <a href="informe_svd.pdf" class="download-btn" download>📥 Descargar PDF</a>
    </div>
</body>
</html>
